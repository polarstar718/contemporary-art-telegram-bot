services:
  - type: web
    name: contemporary-art-telegram-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python api/index.py
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_SUBSCRIBER_CHAT_IDS
        sync: false
      - key: TIMEZONE
        value: "Asia/Seoul"
